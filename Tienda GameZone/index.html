<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Zone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/estiloGameZone.css">
    <script src="js/GameZone.js" defer></script>
</head>

<body>
    <header>

        <h1 id="titulo-sitio">Game Zone tienda de Juegos</h1>

        <img src="imagenes/ChatGPT Image 3 sept 2026, 12_09_51 a.m..png" alt="Logo GameZone" width="400" height="300">

        <nav>
            <a href="#home">Home</a>
            <a href="#registro">Registro</a>
            <a href="#inicio">Inicio Sesión</a>
        </nav>

    </header>

    <main>

        <section id="registro" class="hero">

            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-md-8 col-lg-6">
                        <h2 class="text-center mb-4">Registro</h2>

                        <form action="" id="formulario-registro" class="border rounded py-4 shadow bg-white">
                            <div id="mb-3">
                                <label for="nombre" class="form-label">Nombre</label>

                                <input type="text" id="nombre", class="form-control", placeholder="Ingrese su nombre completo">
                            </div>

                            <div id="mb-3">
                                <label for="correo" class="form-control">Correo Electronico</label>

                                <input type="email" id="correo" class="form-control" placeholder="Ingrese su correo nombre@gmail.com">
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </section>
    </main>
</body>
</html>
